name: Release

on:
  push:
    tags:
      - 'v*' 

jobs:
  publish-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
      - run: cargo install cargo-release
      - run: cargo release publish --all-features --no-confirm --no-verify --execute
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Publishes each workspace package in turn. The repository root is private
  # and publishes nothing, so a bare `bun publish` here would ship an empty
  # tarball or fail outright.
  #
  # Sequential rather than a matrix: sqon declares @surrealdb/cbor as
  # workspace:*, which bun rewrites to cbor's concrete version on publish. If
  # sqon lands on the registry before that version of cbor does, anyone
  # installing sqon in the gap resolves a dependency that is not there yet.
  #
  # id-token is for JSR, which authenticates from GitHub's OIDC token rather
  # than a stored secret.
  publish-ts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun run build

      - name: Validate publishing
        run: |
          for pkg in packages/cbor packages/sqon packages/protocol; do
            (cd "$pkg" && bun publish --access public --tag stable --dry-run)
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @surrealdb/cbor
        run: cd packages/cbor && bun publish --access public --tag stable
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      # cbor has shipped to JSR since it lived in its own repository, and
      # consumers there should not be dropped by the move. build.ts writes the
      # jsr.json this reads.
      - name: Publish @surrealdb/cbor to JSR
        run: cd packages/cbor && bunx jsr publish

      - name: Publish @surrealdb/sqon
        run: cd packages/sqon && bun publish --access public --tag stable
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @surrealdb/protocol
        run: cd packages/protocol && bun publish --access public --tag stable
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0  # Fetch full history for changelog generation

    - name: Create Release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
