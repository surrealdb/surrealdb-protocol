name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here checks out, builds, lints or tests, and writes nothing back:
# no comments, no releases, no packages. Read access to the repository is all
# any of them needs, so the token is scoped to that rather than inheriting the
# repository default.
#
# Declared once at the top level so it applies to jobs added later too -- a
# per-job block would leave the next job to opt in and quietly get the default.
permissions:
  contents: read

jobs:
  proto-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: bufbuild/buf-action@c231a1aa9281e5db706c970f468f0744a37561fd # v1
        with:
          setup_only: true
      - run: buf lint

  proto-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@c231a1aa9281e5db706c970f468f0744a37561fd # v1
        with:
          setup_only: true
      # v1 is unstable until a server serves SurrealDBService, so a breaking
      # change is reported and gated behind a label rather than failing outright.
      # At the freeze, delete the label escape hatch below -- that IS the freeze.
      #
      # `ref=origin/main`, not `branch=main`: the PR checkout lands on a detached
      # HEAD with refs/remotes/origin/main and no local main, so buf could not
      # resolve the base and died with "couldn't find remote ref main" on every
      # run. Under the old `continue-on-error: true` that surfaced as
      # `outcome == failure`, indistinguishable from a real finding, so the label
      # was demanded on every PR while buf had in fact never compared anything.
      #
      # Hence the explicit exit codes: buf uses 100 for "found violations" and
      # non-zero-non-100 for "could not run". Conflating those is what hid the
      # breakage, so a run failure now fails the job loudly instead of being
      # laundered into a label requirement.
      - name: Check for breaking schema changes
        id: breaking
        run: |
          set +e
          buf breaking --against '.git#ref=origin/main'
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "found=false" >>"$GITHUB_OUTPUT" ;;
            100)
              echo "found=true" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "::error::buf breaking could not run (exit $rc). This is not a schema finding; the check itself is broken."
              exit 1 ;;
          esac
      # Only reached when buf actually found something.
      #
      # Note this sees .proto only. buf does not parse .fbs, so a flatbuffers
      # wire change cannot reach this gate and still needs the label applied by
      # hand -- see scripts/parity.ts and parity.toml for what does watch .fbs.
      - name: Require the protocol-breaking label
        if: steps.breaking.outputs.found == 'true'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "::warning::This PR changes the wire format."
          case ",$LABELS," in
            *,protocol-breaking,*)
              echo "Labelled protocol-breaking; allowed while v1 is unstable." ;;
            *)
              echo "::error::Breaking schema change without the 'protocol-breaking' label."
              exit 1 ;;
          esac

  # value.proto and value.fbs model the same type graph and both are live wire
  # formats, so they are checked against each other rather than kept in sync by
  # hand.
  proto-fbs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - uses: bufbuild/buf-action@c231a1aa9281e5db706c970f468f0744a37561fd # v1
        with:
          setup_only: true
      - run: bun run scripts/parity.ts


  # Generated code is checked in. This asserts it still matches the schemas, so
  # a schema change cannot land without its generated counterpart.
  #
  # Runs `make gen-check`, which regenerates everything -- protobuf AND
  # flatbuffers -- and diffs the paths the Makefile declares. Re-deriving that
  # scope here by hand is how the flatbuffers half went unchecked before: the
  # job ran proto-gen only, but diffed gen/rust, which contains gen/rust/fb.
  proto-gen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - uses: bufbuild/buf-action@c231a1aa9281e5db706c970f468f0744a37561fd # v1
        with:
          setup_only: true

      # The generators are pinned, so a hit here skips compiling
      # protoc-gen-prost and protoc-gen-tonic from source on every run.
      #
      # Only the self-contained ones are cached. protoc-gen-c is deliberately
      # excluded: it is a system package that links libprotobuf at runtime, so
      # caching the binary without its shared libraries produces a file that
      # exists -- which makes `make` skip the recipe that would have installed
      # those libraries -- and then fails to load. Leaving it out of the cache
      # means its recipe runs every time and installs what it needs.
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: |
            plugins/protoc-gen-prost
            plugins/protoc-gen-tonic
            plugins/flatc
          key: plugins-${{ runner.os }}-${{ hashFiles('Makefile') }}

      # The Makefile installs the generators it needs, including protoc-gen-c
      # and the pinned flatc, so there is nothing to install by hand here.
      - run: make gen-check

  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
      - run: cargo test
  
  rust-check-features:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "proto"
          - "flatbuffers"
          - "rpc"
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # v1
        with:
          toolchain: stable
          override: true
      - run: cargo build --no-default-features --features ${{ matrix.features }}

  # Runs the workspace's own pinned biome via `bun run qc`, rather than a
  # separately installed one. The packages disagree on formatting -- the
  # protocol package is tab-indented, cbor and sqon are four-space -- and that
  # is settled by nested biome configs, which only resolve when biome is
  # invoked from the repository root against the version the manifest pins.
  ts-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun run qc

  ts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun test

  ts-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun run build

  # The release workflow publishes three packages from this repository, and a
  # manifest that cannot be packed is not something to find out at tag time.
  # Each package is packed exactly as the release would pack it.
  ts-publish-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: "1.2.21"
      - run: bun install
      - run: bun run build
      # The token is needed even for --dry-run: bun authenticates against the
      # registry before it reports what it would have sent.
      - name: Pack every package
        run: |
          for pkg in packages/cbor packages/sqon packages/protocol; do
            echo "::group::$pkg"
            (cd "$pkg" && bun publish --access public --dry-run)
            echo "::endgroup::"
          done
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
