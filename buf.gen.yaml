version: v2
clean: true

inputs:
  - directory: .

plugins:
  # C
  - local: ./plugins/protoc-gen-c
    out: gen/c
  
  # Rust
  - local: ./plugins/protoc-gen-prost
    out: gen/rust/proto
    opt:
      - btree_map=.
      - bytes=.
      - file_descriptor_set=false
      - enable_type_names=true
      - type_attribute=.=#[derive(serde::Deserialize\,serde::Serialize)]
      # Duration and Datetime are now plain SurrealDB-native messages rather
      # than well-known types, so they need no custom serde.
      - field_attribute=surrealdb.protocol.v1.Value.value=#[serde(flatten)]
      - field_attribute=surrealdb.protocol.v1.Geometry.geometry=#[serde(flatten)]
      # Object and Variables are repeated KeyValue on the wire but stay JSON
      # objects, so the JSON form does not leak the encoding change.
      - field_attribute=surrealdb.protocol.v1.Object.items=#[serde(flatten\, with = "crate::serde_key_values")]
      - field_attribute=surrealdb.protocol.v1.Variables.variables=#[serde(flatten\, with = "crate::serde_key_values")]
  - local: ./plugins/protoc-gen-tonic
    out: gen/rust/proto
  
  # Typescript
  - local: ./plugins/protoc-gen-ts_proto
    out: gen/ts
    strategy: all
    opt:
      - oneof=unions
      - removeEnumPrefix=true
      - forceLong=bigint
      - env=both
      - exportCommonSymbols=true
      - outputEncodeMethods=true
      - outputJsonMethods=true
      - useDate=true
