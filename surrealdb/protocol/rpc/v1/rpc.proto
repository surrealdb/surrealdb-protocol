syntax = "proto3";

package surrealdb.protocol.rpc.v1;

import "surrealdb/protocol/rpc/v1/common.proto";
import "surrealdb/protocol/v1/error.proto";
import "surrealdb/protocol/v1/value.proto";

// The SurrealDB data plane.
//
// This service is the canonical definition of SurrealDB's RPC surface. The
// Rust `SurrealBridge` trait and the TypeScript `SurrealProtocol` interface
// are mirrors of it; where they disagree with it, they are wrong.
//
// Every unary request message carries a `RequestContext` in field 1, naming the
// session it applies to and, where the RPC supports one, the transaction it
// runs in. The client-streaming RPCs, `ImportSurql` and `ImportMlModel`, carry it
// in their `begin` frame instead; see the note on `RequestContext`. Context is in
// the body, never in transport metadata, so a gRPC, HTTP-chunked or WebSocket
// binding of this service is the same contract byte for byte.
//
// There are deliberately no CRUD methods. `select`, `create`, `update` and
// friends are client-side sugar that compiles to SurrealQL and executes
// through `Query` -- the design both current SDKs already independently chose.
// One execution path means one thing to stream, optimise and secure.
service SurrealDBService {
    // ---------------------------------------------------------------- //
    //                          Negotiation                             //
    // ---------------------------------------------------------------- //

    // Report what this server supports.
    //
    // Callable before authenticating and before anything else. Clients SHOULD
    // call it first and branch on the result rather than inferring behaviour
    // from a version string: capabilities depend on operator configuration as
    // well as build version, and a version table cannot model that.
    rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);

    // ---------------------------------------------------------------- //
    //                          Connection                              //
    // ---------------------------------------------------------------- //

    // Check that the server is reachable and able to serve requests.
    //
    // The server's version is reported by `GetCapabilities`, not here: a
    // version string is the wrong thing to branch on, which is that method's
    // whole premise.
    rpc Health(HealthRequest) returns (HealthResponse);

    // ---------------------------------------------------------------- //
    //                           Sessions                               //
    // ---------------------------------------------------------------- //

    // Create a session, or adopt an existing one onto this connection.
    //
    // The session id is `context.session`; absent asks the server to allocate
    // one. Attaching an id that is already attached is a no-op, which is what
    // makes this safe to replay after a reconnect.
    rpc AttachSession(AttachSessionRequest) returns (AttachSessionResponse);

    // Release a session and everything it owns.
    //
    // Open transactions are cancelled and open subscriptions end with
    // SUBSCRIBE_END_REASON_SESSION_CLOSED.
    rpc DetachSession(DetachSessionRequest) returns (DetachSessionResponse);

    // Return a session to its initial state without releasing it.
    //
    // Clears namespace, database, variables and authentication. The session id
    // stays valid and stays attached.
    rpc ResetSession(ResetSessionRequest) returns (ResetSessionResponse);

    // ---------------------------------------------------------------- //
    //                        Session context                           //
    // ---------------------------------------------------------------- //

    // Select the namespace and/or database a session operates in.
    rpc Use(UseRequest) returns (UseResponse);

    // Bind a session-scoped variable, referenced in queries as `$name`.
    rpc SetVariable(SetVariableRequest) returns (SetVariableResponse);

    // Remove a session-scoped variable.
    rpc UnsetVariable(UnsetVariableRequest) returns (UnsetVariableResponse);

    // ---------------------------------------------------------------- //
    //                        Authentication                            //
    // ---------------------------------------------------------------- //

    // Register a new record user and authenticate the session as them.
    rpc Signup(SignupRequest) returns (SignupResponse);

    // Authenticate the session with credentials.
    rpc Signin(SigninRequest) returns (SigninResponse);

    // Authenticate the session with an existing access token.
    rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);

    // Exchange a refresh token for a new token pair.
    rpc RefreshTokens(RefreshTokensRequest) returns (RefreshTokensResponse);

    // Invalidate tokens for all future use, on every session and connection.
    rpc RevokeTokens(RevokeTokensRequest) returns (RevokeTokensResponse);

    // Clear the session's authentication without touching anything else.
    rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);

    // ---------------------------------------------------------------- //
    //                         Transactions                             //
    // ---------------------------------------------------------------- //

    // Open an explicit transaction owned by the session.
    //
    // The transaction outlives this RPC and every `Query` that runs in it;
    // only `CommitTransaction`, `CancelTransaction`, `DetachSession` or the
    // server's transaction timeout end it.
    rpc BeginTransaction(BeginTransactionRequest) returns (BeginTransactionResponse);

    // Commit `context.transaction`, persisting everything done in it.
    rpc CommitTransaction(CommitTransactionRequest) returns (CommitTransactionResponse);

    // Cancel `context.transaction`, discarding everything done in it.
    rpc CancelTransaction(CancelTransactionRequest) returns (CancelTransactionResponse);

    // ---------------------------------------------------------------- //
    //                            Query                                 //
    // ---------------------------------------------------------------- //

    // Execute SurrealQL and stream the results.
    //
    // Cancelling the RPC aborts execution: without `context.transaction` the
    // implicit transaction is rolled back -- streamed results do not imply a
    // commit, only a completed stream does. With `context.transaction` the
    // transaction is session-owned and survives a cancelled RPC.
    rpc Query(QueryRequest) returns (stream QueryResponse);

    // Call a built-in function, a custom function, or an ML model.
    //
    // Not sugar for `Query`, which is why it is its own method rather than
    // client-side SurrealQL. Synthesising `RETURN fn::foo(...)` costs three
    // things: the operator's per-method deny list cannot see it (it arrives as
    // Query, so denying `run` is silently unenforced), the arguments are
    // lowered by a text round-trip that need not agree with how the same value
    // binds as a parameter, and `name` resolution -- which decides between a
    // built-in, `fn::`, `ml::` and the errors each raises -- moves out of the
    // server and into every SDK.
    rpc Run(RunRequest) returns (RunResponse);

    // Kill a live query by id.
    //
    // Its own method for the same reason as `Run`: sent as `KILL $id` it
    // arrives as Query and the deny list cannot gate it.
    rpc Kill(KillRequest) returns (KillResponse);

    // ---------------------------------------------------------------- //
    //                         Live queries                             //
    // ---------------------------------------------------------------- //

    // Stream one live query's notifications.
    //
    // One stream per subscription; there is no multiplexed notification
    // channel. A live query may have many concurrent subscribers, each with
    // its own stream and its own `subscription_id`. See `SubscribeRequest` for
    // the two ways to name the live query and what each implies for lifetime.
    rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

    // ---------------------------------------------------------------- //
    //                       Import and export                          //
    // ---------------------------------------------------------------- //

    // Import a SurrealQL byte stream. All statements run in one transaction.
    rpc ImportSurql(stream ImportSurqlRequest) returns (ImportSurqlResponse);

    // Export the database as a flat SurrealQL byte stream.
    rpc ExportSurql(ExportSurqlRequest) returns (stream ExportSurqlResponse);

    // Export the database as a streamed directory of files.
    //
    // Unlike `ExportSurql`, which emits a flat SurrealQL byte stream, this
    // reproduces a directory-format export (manifest + schema + per-table data
    // files) over the wire. Each file is framed as FileBegin -> FileChunk* ->
    // FileEnd, so neither peer ever buffers a whole file; the file's byte count
    // and BLAKE3 hash are carried in the FileEnd trailer, computed incrementally as
    // chunks are produced. The manifest is streamed as the final file, and the
    // End frame is the completion token.
    rpc ExportDirectory(ExportDirectoryRequest) returns (stream ExportDirectoryResponse);

    // Export a SurrealML model as a byte stream.
    rpc ExportMlModel(ExportMlModelRequest) returns (stream ExportMlModelResponse);

    // Import a SurrealML model from a byte stream.
    //
    // The client-streaming mirror of `ExportMlModel`, framed exactly as
    // `ImportSurql` (`begin` -> `chunk`* -> `trailer`) so both imports share one
    // framing implementation on each side. Without it a model could be exported
    // over this protocol but never put back.
    rpc ImportMlModel(stream ImportMlModelRequest) returns (ImportMlModelResponse);
}

// ==================================================================== //
//                            Negotiation                               //
// ==================================================================== //

// Who is connecting.
//
// Recorded by the server so operators can see which SDKs and runtimes are in
// use. Sent in the body rather than only as a transport header because the
// embedded binding has no headers and the question is just as interesting
// there. Servers SHOULD also record the transport `user-agent` when one is
// present, and treat it as the fallback for clients that skip the handshake.
message ClientInfo {
    // SDK identifier, for example "surrealdb.js" or "surrealdb-go".
    string name = 1;
    // SDK version.
    string version = 2;
    // Host runtime, for example "node/22.3.0", "browser/chrome-131", "rustc/1.85".
    string platform = 3;
    // Anything not worth a field of its own. Servers MUST tolerate unknown
    // keys, and MUST bound what they retain rather than storing it unbounded.
    repeated surrealdb.protocol.v1.KeyValue metadata = 4;
}

// How hard the server tries to deliver a live-query notification.
enum LiveQueryDelivery {
    LIVE_QUERY_DELIVERY_UNSPECIFIED = 0;
    // Best-effort: a notification may be lost and is never redelivered.
    LIVE_QUERY_DELIVERY_AT_MOST_ONCE = 1;
    // Durable: a notification is never lost, but MAY be delivered more than
    // once. Consumers must dedupe on `LiveQueryCursor`.
    LIVE_QUERY_DELIVERY_AT_LEAST_ONCE = 2;
}

// What this server's live queries actually guarantee.
//
// These vary by deployment -- the live-query engine is an operator setting --
// so they are reported rather than assumed. An SDK that ignores this and
// assumes exactly-once will double-apply notifications on an at-least-once
// server.
message LiveQueryCapabilities {
    // Delivery guarantee.
    LiveQueryDelivery delivery = 1;
    // Whether `SubscribeRequest.resume_from` is honoured.
    bool resumable = 2;
    // Whether several subscribers may attach to one live query at once.
    bool multiple_subscribers = 3;
    // How far back `resume_from` can reach. A cursor older than this is
    // rejected with SUBSCRIBE_END_REASON_CURSOR_TOO_OLD. Zero when the server
    // does not retain history.
    surrealdb.protocol.v1.Duration retention = 4;
}

// Numeric bounds a client must respect.
message Limits {
    // Largest message the server will accept or emit, in bytes.
    uint64 max_message_bytes = 1;
    // Largest `DataChunk` or `FileChunk` payload, in bytes.
    uint64 max_chunk_bytes = 2;
    // Longest a single query may run before the server aborts it.
    surrealdb.protocol.v1.Duration max_query_duration = 3;
    // Largest number of records the server will put in one query batch,
    // whatever `QueryRequest.max_batch_records` asks for.
    //
    // Distinct from `max_chunk_bytes`, which bounds a `DataChunk` or
    // `FileChunk` and has never applied to query batches. Zero means the server
    // is not reporting one, which is what a server predating this field looks
    // like; a client MUST treat that as "unknown" and not as "no records
    // allowed".
    uint32 max_batch_records = 4;
}

// What this server supports.
message ServerCapabilities {
    // The SurrealDB build version.
    //
    // Not a gate -- that is what `capabilities` is for. Useful for telemetry,
    // for error messages, and as the last resort for working around a bug in a
    // specific version range, which capabilities cannot express.
    //
    // Empty means the server is withholding it, which is how an operator who has
    // denied the `version` method is honoured: this field is the only place the
    // build version is reported (there is deliberately no `Version` RPC, since
    // that would duplicate it and `Health` already answers liveness), so a
    // deny-list entry for `version` has to suppress it here or it does nothing at
    // all. A server that withholds it MUST also list `Version` in
    // `denied_methods`, so a client can tell "withheld by policy" from "an older
    // server that did not populate the field".
    //
    // A version string is never legitimately empty, so no explicit presence
    // marker is needed -- and none is available: `optional` on a proto3 scalar is
    // rejected outright by the C generator this schema also targets.
    //
    // Clients MUST NOT treat empty as a fatal error. Nothing in the protocol
    // requires the build version; a client that refuses to proceed without it
    // makes the deny-list entry unusable, which is what this paragraph exists to
    // prevent.
    string server_version = 1;
    // Oldest protocol version this server speaks.
    SemVer low_api_version = 2;
    // Newest protocol version this server speaks.
    SemVer high_api_version = 3;
    // Coarse features this server supports, as free-form names.
    //
    // Strings rather than an enum so SurrealDB can introduce a capability
    // without a protocol release: the set of things a server might support
    // grows faster than this schema does, and gating that on a new enum value
    // would make every feature flag a coordinated change across four repos.
    //
    // Names are UPPER_SNAKE_CASE and, once published, permanent -- a client
    // matching on one must keep working. Clients MUST ignore names they do not
    // recognise rather than treating them as an error.
    //
    // The names this protocol version defines, and which a server SHOULD use
    // where they apply, are:
    //
    //   SESSIONS               several sessions multiplexed over one connection
    //   TRANSACTIONS           explicit client-driven transactions
    //   LIVE_QUERIES           live queries and subscriptions
    //   REFRESH_TOKENS         refresh-token exchange
    //   EXPORT_DIRECTORY       directory-format export
    //   ML_MODELS              SurrealML model export and import
    //   COLUMNAR_RESULTS       columnar (Arrow) query results
    //   EXPORT_EXCLUDE_TABLES  `ExportConfig.Tables.excluded`
    //
    // EXPORT_EXCLUDE_TABLES is load-bearing rather than advisory, and is the one
    // name here a client is expected to check before sending: an `excluded`
    // selection reaching a server without it cannot be decoded, and the export
    // fails by design instead of exporting the tables the caller asked to
    // withhold. See `ExportConfig.Tables`.
    //
    // This list is documentation, not a constraint. A server may report names
    // that are not on it.
    repeated string capabilities = 4;
    // Fully-qualified names of RPCs the operator has disabled, for example
    // "surrealdb.protocol.rpc.v1.SurrealDBService/ExportSurql". Capabilities are
    // coarse; deny lists are per-method, and both exist server-side, so both
    // are reported rather than lossily projecting one onto the other.
    //
    // These strings are the generated gRPC method paths, so they move whenever an
    // RPC or the service is renamed -- which `v1` still permits, so this is a
    // live hazard and not a hypothetical one. A client comparing against its own
    // hardcoded literal then silently matches nothing and stops honouring the
    // denial, with no compile error anywhere. Clients MUST compare against names
    // derived from the service descriptor rather than hand-written strings. The
    // Rust bindings export them as constants for exactly that purpose (the
    // `method_names` module, whose contents are checked against the generated
    // service so the constants cannot themselves go stale).
    //
    // Note the form: these entries have NO leading slash, while the gRPC path on
    // the wire does. Comparing one against the other fails on every method.
    //
    // A denied method may also be reported for something with no RPC of its own:
    // `Version` appears here when the build version is withheld from
    // `server_version`. Clients MUST tolerate a name that does not correspond to
    // a method they know.
    repeated string denied_methods = 5;
    // Numeric bounds.
    Limits limits = 6;
    // Live-query guarantees.
    LiveQueryCapabilities live_queries = 7;
    // Per-message compression codecs this server can decode, as the literal
    // `grpc-accept-encoding` tokens -- "identity", "gzip", "zstd". Most
    // preferred first; a client MAY treat the order as a hint and MUST NOT
    // treat it as a requirement.
    //
    // This is gRPC message compression, and has nothing to do with
    // `QueryRequest.accepted_encodings`, which selects the shape of a result
    // (row-oriented values or columnar Arrow) and is unrelated to how the
    // message carrying it is framed. The two names are close enough to be
    // confused, so: this field is transport, that field is payload. Neither is
    // `ExportCompression`, which compresses the contents of an export file and
    // is applied before the message is built.
    //
    // Tokens rather than an enum because the values are the gRPC codec
    // registry's, not SurrealDB's. An enum would need a protocol release for
    // every codec gRPC registers, and would need an enum-to-token mapping in
    // each binding -- a mapping that turns a codec the binding does not know
    // into UNSPECIFIED, which is indistinguishable from "the server said
    // nothing". Passing the token through keeps an unknown codec merely
    // unusable instead of misreported.
    //
    // Empty means unknown, which is what a server predating this field looks
    // like -- NOT "no compression supported". A client MUST read empty as
    // "send `identity` and do not probe", never as an error. A server with no
    // compression available SHOULD list exactly "identity", which says so
    // positively and is what the embedded binding reports, since it has no
    // gRPC framing to compress.
    //
    // `identity` is always accepted whether or not it appears here. Listing it
    // is only how a server distinguishes "uncompressed only" from silence.
    //
    // Advisory, like every other capability. A codec listed here may still be
    // refused -- a proxy may have synthesised this response, or terminated TLS
    // and re-framed without the codec the backend has. gRPC already defines
    // that failure: the call fails UNIMPLEMENTED with the server's real
    // `grpc-accept-encoding` in the trailers. A client MUST handle it by
    // falling back to `identity` and retrying, and MUST NOT require this field
    // to be populated before it will compress at all. Reading it correctly
    // saves the probe; it does not remove the fallback.
    repeated string accepted_message_encodings = 8;
}

// Request to report server capabilities.
message GetCapabilitiesRequest {
    // Present for uniformity with every other request. `session` and
    // `transaction` MUST be unset: capabilities are a property of the server
    // and the connection, not of a session.
    RequestContext context = 1;
    // Who is connecting.
    ClientInfo client = 2;
}

// Response reporting server capabilities.
//
// Capabilities are fixed for the lifetime of a connection and MUST be
// re-fetched after reconnecting: an operator may have restarted the server
// with a different configuration, or a load balancer may have routed the new
// connection to a node running a different version.
//
// A capability is an optimisation, never a substitute for handling errors. If
// any RPC fails as unimplemented or not-allowed, the client MUST clear that
// capability for the connection and surface a typed error, whatever this
// response said. That rule is what keeps clients correct when the answer is
// stale, or synthesised by a proxy.
message GetCapabilitiesResponse {
    ServerCapabilities capabilities = 1;
}

// ==================================================================== //
//                             Connection                               //
// ==================================================================== //

// Request to check the health of the database.
message HealthRequest {
    RequestContext context = 1;
}

// Response to a health check request.
message HealthResponse {}

// ==================================================================== //
//                              Sessions                                //
// ==================================================================== //

// Request to create or adopt a session.
message AttachSessionRequest {
    // `context.session` names the session to attach. Absent asks the server to
    // allocate one.
    RequestContext context = 1;
}

// Response to a session attach.
message AttachSessionResponse {
    // The attached session's id, allocated by the server when the request did
    // not name one.
    surrealdb.protocol.v1.Uuid session = 1;
    // True when this call created the session, false when it adopted one that
    // already existed. Lets a client tell "the server still has my session"
    // from "the server lost it and gave me a fresh one" after a reconnect,
    // which decides whether its cached namespace, variables and auth are
    // still in effect.
    bool created = 2;
}

// Request to release a session.
message DetachSessionRequest {
    // `context.session` names the session to release.
    RequestContext context = 1;
}

// Response to a session detach.
message DetachSessionResponse {}

// Request to reset a session.
message ResetSessionRequest {
    // `context.session` names the session to reset.
    RequestContext context = 1;
}

// Response to a session reset.
message ResetSessionResponse {}

// ==================================================================== //
//                           Session context                            //
// ==================================================================== //

// Request to select the namespace and database.
//
// Both fields are three-state: absent leaves the current selection alone,
// `null` clears it, and a string sets it. Clearing and leaving alone are
// genuinely different operations, which a plain string cannot express.
message UseRequest {
    RequestContext context = 1;
    NullableString namespace = 2;
    NullableString database = 3;
}

// Response reporting the resulting selection.
message UseResponse {
    // The namespace now in use; empty when none is selected.
    string namespace = 1;
    // The database now in use; empty when none is selected.
    string database = 2;
}

// Request to bind a session variable.
message SetVariableRequest {
    RequestContext context = 1;
    // The name, without the leading `$`.
    string name = 2;
    surrealdb.protocol.v1.Value value = 3;
}

// Response to binding a session variable.
message SetVariableResponse {}

// Request to remove a session variable.
message UnsetVariableRequest {
    RequestContext context = 1;
    string name = 2;
}

// Response to removing a session variable.
message UnsetVariableResponse {}

// ==================================================================== //
//                           Authentication                             //
// ==================================================================== //

// Username and password credentials, at root, namespace or database level.
//
// The level is implied by which scoping fields are set: neither means root,
// `namespace` alone means namespace level, both means database level.
//
// This replaces the previous split into RootUserCredentials,
// NamespaceUserCredentials and DatabaseUserCredentials. That split claimed to
// make illegal states unrepresentable but did not -- the database variant
// could still carry an empty namespace -- while being unable to express a
// system user authenticating through a named access method at all. Servers
// validate the combination regardless, so the split bought nothing.
message UserCredentials {
    // Empty for a root user.
    string namespace = 1;
    // Empty for a root or namespace user.
    string database = 2;
    string username = 3;
    string password = 4;
    // Optional named system access method.
    string access = 5;
}

// Record-access credentials, for users defined by a record access method.
//
// The variables are passed to the access method's SIGNIN or SIGNUP clause.
message RecordCredentials {
    string namespace = 1;
    string database = 2;
    string access = 3;
    surrealdb.protocol.v1.Variables variables = 4;
}

// Bearer-key credentials for a named access method.
message BearerCredentials {
    string namespace = 1;
    string database = 2;
    string access = 3;
    string key = 4;
}

// How the caller wishes to authenticate.
message AccessMethod {
    oneof method {
        UserCredentials user = 1;
        RecordCredentials record = 2;
        BearerCredentials bearer = 3;
    }
}

// An access token and its refresh token, with their expiry.
//
// Expiry is stated explicitly so that clients can schedule renewal without
// decoding the access token. Every SDK currently parses the JWT's `exp` claim
// itself, which couples all of them to SurrealDB's token format for no reason.
message Tokens {
    // The access token, presented on subsequent authentication.
    string access = 1;
    // The refresh token, exchanged via `RefreshTokens`. Empty when the access
    // method does not issue one.
    string refresh = 2;
    // When the access token stops being accepted.
    surrealdb.protocol.v1.Datetime expires_at = 3;
    // When the refresh token stops being accepted.
    surrealdb.protocol.v1.Datetime refresh_expires_at = 4;
}

// Request to register a new record user.
message SignupRequest {
    RequestContext context = 1;
    RecordCredentials credentials = 2;
}

// Response to a signup request.
message SignupResponse {
    Tokens tokens = 1;
}

// Request to authenticate with credentials.
message SigninRequest {
    RequestContext context = 1;
    AccessMethod access_method = 2;
}

// Response to a signin request.
message SigninResponse {
    Tokens tokens = 1;
}

// Request to authenticate with an existing token.
message AuthenticateRequest {
    RequestContext context = 1;
    string token = 2;
}

// Response to an authenticate request.
message AuthenticateResponse {
    // The token's expiry, so a client that authenticated with a token it did
    // not mint can still schedule renewal.
    //
    // Always populated, including when `tokens` is set, so a client built
    // against an earlier version of this schema keeps working. When `tokens` is
    // set this MUST equal `tokens.expires_at`; the two can only disagree
    // through a server bug, and clients SHOULD prefer `tokens.expires_at`.
    surrealdb.protocol.v1.Datetime expires_at = 1;
    // The tokens now in effect, when the server issued new ones.
    //
    // Authenticating is allowed to rotate: what ends up in effect is not
    // necessarily the token that was presented. Unset means the presented token
    // remains in effect unchanged -- the common case -- and clients MUST then
    // keep using it rather than reading an empty `access` back over it.
    //
    // A client that records the token it authenticated with (to replay onto a
    // reconnected or cloned session) MUST record the rotated one when this is
    // set. Without this field a rotating server is indistinguishable from a
    // non-rotating one, and the client replays a token the server has already
    // superseded.
    Tokens tokens = 2;
}

// Request to exchange a refresh token for a new pair.
message RefreshTokensRequest {
    RequestContext context = 1;
    string refresh = 2;
    // The expired access token the refresh token was issued alongside.
    //
    // Required, despite being the token that just stopped working. Refresh is
    // scoped: the server recovers the namespace, database and access method the
    // new pair is to be minted for by decoding this token's claims, because the
    // refresh token itself names none of them. With only `refresh` there is
    // nothing to decode and the exchange cannot be performed at all -- so this
    // is not a convenience, it is what makes the RPC implementable.
    //
    // Tag 3 rather than folding both into a `Tokens` at tag 2: retagging
    // `refresh` would make an old client's refresh token decode as a different
    // field on a new server. `RevokeTokens` already takes `{access, refresh}`,
    // so this makes the two token RPCs agree rather than introducing a new
    // requirement.
    string access = 3;
}

// Response carrying the new token pair.
message RefreshTokensResponse {
    Tokens tokens = 1;
}

// Request to invalidate tokens everywhere.
message RevokeTokensRequest {
    RequestContext context = 1;
    // The access token to revoke, if any.
    string access = 2;
    // The refresh token to revoke, if any.
    string refresh = 3;
}

// Response to a token revocation.
message RevokeTokensResponse {}

// Request to clear the session's authentication.
message InvalidateRequest {
    RequestContext context = 1;
}

// Response to an invalidate request.
message InvalidateResponse {}

// ==================================================================== //
//                            Transactions                              //
// ==================================================================== //

// Request to open an explicit transaction.
message BeginTransactionRequest {
    RequestContext context = 1;
}

// Response carrying the new transaction's id.
message BeginTransactionResponse {
    // Pass this as `context.transaction` on the queries that should run in it.
    surrealdb.protocol.v1.Uuid transaction = 1;
}

// Request to commit a transaction.
message CommitTransactionRequest {
    // `context.transaction` names the transaction to commit.
    RequestContext context = 1;
}

// Response to a commit.
message CommitTransactionResponse {}

// Request to cancel a transaction.
message CancelTransactionRequest {
    // `context.transaction` names the transaction to cancel.
    RequestContext context = 1;
}

// Response to a cancellation.
message CancelTransactionResponse {}

// ==================================================================== //
//                               Query                                  //
// ==================================================================== //

// Request to execute SurrealQL.
message QueryRequest {
    RequestContext context = 1;
    // One or more SurrealQL statements.
    string query = 2;
    // Values bound as `$name`.
    surrealdb.protocol.v1.Variables variables = 3;
    // Result encodings the client is willing to receive, most preferred first.
    //
    // The server MUST reply using one of these, and MUST NOT use an encoding
    // the client did not list. Absent means row-oriented values only. This is
    // the rule that keeps a future encoding from reaching an old client as an
    // empty result set, which would look like success.
    repeated ResultEncoding accepted_encodings = 4;
    // The largest number of records the client wants in one batch.
    //
    // The server MAY send fewer -- it sends fewer while ramping up, and to stay
    // inside `Limits.max_message_bytes` -- and MUST NOT send more. Zero means
    // the server chooses. A client optimising for time-to-first-row asks for a
    // small number; one optimising for throughput asks for a large one.
    //
    // Clamped to `Limits.max_batch_records` rather than rejected, so a client
    // that asks for more than the server allows still gets results.
    uint32 max_batch_records = 5;
}

// A way of encoding query results.
enum ResultEncoding {
    RESULT_ENCODING_UNSPECIFIED = 0;
    // Row-oriented `Value`s. Always supported.
    RESULT_ENCODING_VALUES = 1;
    // Columnar Arrow IPC. Only when the server advertises
    // CAPABILITY_COLUMNAR_RESULTS and the client asks for it.
    RESULT_ENCODING_ARROW = 2;
}

// What kind of statement produced a result.
//
// Tells a client that a statement's result value is a live-query id without
// having to inspect the SurrealQL it sent. A single query may contain several
// LIVE SELECT statements, each returning its own id, and each independently
// subscribable.
enum QueryStatementKind {
    QUERY_STATEMENT_KIND_UNSPECIFIED = 0;
    // Any ordinary statement.
    QUERY_STATEMENT_KIND_OTHER = 1;
    // A LIVE SELECT. The result value is the new live query's id.
    QUERY_STATEMENT_KIND_LIVE = 2;
    // A KILL.
    QUERY_STATEMENT_KIND_KILL = 3;
}

// The kind of a query result batch.
enum QueryResponseKind {
    QUERY_RESPONSE_KIND_UNSPECIFIED = 0;
    // The statement produces exactly one value and no further batches follow.
    // Used for `SELECT ONLY ...` and similar. Terminal for its query index and
    // carries the stats.
    QUERY_RESPONSE_KIND_SINGLE = 1;
    // A batch of values; more may follow for this query index.
    QUERY_RESPONSE_KIND_BATCHED = 2;
    // The final batch for this query index. Always carries the stats. When a
    // statement's results fit in one batch this is the first and only batch.
    QUERY_RESPONSE_KIND_BATCHED_FINAL = 3;
}

// A batch of row-oriented values.
//
// A message rather than a bare repeated field because proto3 forbids
// `repeated` inside a `oneof`, and the payload has to be a `oneof` so that
// exactly one encoding is populated per batch. Costs two bytes per batch.
message ValueBatch {
    repeated surrealdb.protocol.v1.Value values = 1;
}

// A batch of columnar results, as Arrow IPC.
//
// Not served yet; defined now because the shape cannot be retrofitted. The
// payload must be a message rather than bare bytes: SurrealDB is schemaless,
// the Arrow IPC stream format forbids a second schema message mid-stream, and
// a statement whose rows change shape therefore needs several sequential IPC
// streams -- which needs a per-frame discriminator that a bare `bytes` field
// has nowhere to put.
message ArrowBatch {
    // One or more complete encapsulated Arrow IPC messages.
    //
    // Concatenating the payloads for one query index in `batch_index` order,
    // within a single `stream_sequence`, yields a valid Arrow IPC stream. That
    // one rule subsumes schema-first and dictionaries-before-use ordering.
    bytes payload = 1;
    // Which IPC stream this belongs to, counting from zero within its query
    // index. Increments when the row shape changes and the server must start a
    // fresh stream; readers finish the previous stream before starting this one.
    uint32 stream_sequence = 2;
}

// Query statistics.
message QueryStats {
    // The number of records returned. -1 if unknown.
    int64 records_returned = 1;
    // The number of bytes returned. -1 if unknown.
    int64 bytes_returned = 2;
    // The number of records scanned. -1 if unknown.
    int64 records_scanned = 3;
    // The number of bytes scanned. -1 if unknown.
    int64 bytes_scanned = 4;
    // How long the statement took.
    surrealdb.protocol.v1.Duration execution_duration = 5;
}

// The opening frame of a query stream.
//
// The server MUST send this on accepting the query, before it starts
// executing, so that a long-running query is identifiable while it is still
// running rather than only once it finishes.
message QueryBegin {
    // Identifies this execution.
    //
    // Lets a caller name a query that is still running -- to correlate it with
    // server logs, traces and slow-query records, or to report it to an
    // operator. There is no RPC to stop another connection's query: a client
    // stops its own by cancelling the `Query` stream, and anything beyond that
    // goes through SurrealQL. Should a cancellation method be wanted later,
    // this is the handle it would take, and adding it is additive.
    surrealdb.protocol.v1.Uuid query_id = 1;
    // How many statements the query parsed into.
    //
    // An UPPER BOUND on the query indexes that will appear, suitable for
    // pre-allocation. It is not a count of results: a statement skipped by
    // control flow -- a `RETURN` inside a `BEGIN` block short-circuits the rest
    // -- produces no frames at all. Clients MUST NOT treat an index that
    // received no frame as an empty result.
    //
    // A server sends `begin` before it starts executing, so at that point the
    // number of statements that will produce results is not yet known. The
    // authoritative count arrives in `QueryEnd.result_count`.
    uint32 statement_count = 2;
}

// One statement's results, or part of them.
//
// Rows in a non-terminal batch are PROVISIONAL. A statement's results are valid
// only once its terminal batch arrives without an `error`: a server streams rows
// as it produces them, so rows for a statement inside a `BEGIN ... COMMIT` block
// are delivered before the block commits, and a rollback is reported as an
// `error` on that statement's terminal batch. A client that buffers until the
// terminal batch is unaffected; one that forwards rows as they arrive must be
// able to retract them.
message QueryBatchFrame {
    // Which statement this belongs to, counting from zero.
    uint32 query_index = 1;
    // Which batch within that statement, counting from zero.
    uint64 batch_index = 2;
    // Whether more batches follow for this query index.
    QueryResponseKind kind = 3;
    // What kind of statement produced this.
    QueryStatementKind statement_kind = 4;
    // Present only on the final batch of a query index.
    QueryStats stats = 5;
    // Set when the statement failed. Terminal for its query index: its payload
    // is empty, stats MAY still be present, and other query indexes carry on.
    surrealdb.protocol.v1.SurrealError error = 6;
    // The results. Exactly one encoding is populated, and it is always one the
    // client listed in `accepted_encodings`.
    oneof payload {
        ValueBatch values = 7;
        ArrowBatch arrow = 8;
    }
}

// The frame that completes a query stream successfully.
message QueryEnd {
    // How many query indexes produced results.
    //
    // Authoritative: every frame the query will produce has arrived by the time
    // this does. Never greater than `QueryBegin.statement_count`, and less than
    // it when control flow skipped the tail of the query.
    uint32 result_count = 1;
    // How long the whole query took, including parse and planning.
    //
    // The per-statement durations in `QueryStats` do not sum to this.
    surrealdb.protocol.v1.Duration execution_duration = 2;
}

// Streaming response to a query request.
//
// A successful query arrives as: `begin` once, then `batch` frames, then `end`.
// An `error` frame terminates the stream instead, and is used for failures
// that are not attributable to a single statement; a statement's own failure
// travels in that statement's `batch` frame so the rest of the query can
// continue.
//
// Ordering: batches sharing a `query_index` always arrive in ascending
// `batch_index`. Batches for DIFFERENT query indexes MAY be interleaved
// arbitrarily, and clients MUST demultiplex by `query_index` rather than
// assuming one statement finishes before the next begins. That freedom is what
// lets a server stream each statement's results as soon as it produces them
// instead of holding them until the whole query finishes.
//
// Lifecycle: the query indexes that emit a batch are a subset of
// `[0, begin.statement_count)`, and `end.result_count` says how many of them
// did. A statement skipped by control flow emits nothing, so an index with no
// frame is not an empty result. The final batch for an index is the one
// carrying `stats`, an `error`, or kind SINGLE or BATCHED_FINAL; treat that as
// the authoritative end-of-results signal for that statement, and everything
// before it as provisional -- see `QueryBatchFrame`.
//
// Failures before execution begins -- a parse error, authentication, an
// unknown transaction id -- terminate the RPC with a transport-level error and
// no frames at all.
message QueryResponse {
    oneof frame {
        QueryBegin begin = 1;
        QueryBatchFrame batch = 2;
        QueryEnd end = 3;
        surrealdb.protocol.v1.SurrealError error = 4;
    }
}

// ==================================================================== //
//                         Functions and models                         //
// ==================================================================== //

// Request to call a function or an ML model.
message RunRequest {
    RequestContext context = 1;
    // What to call.
    //
    // Resolved by the SERVER, not the client. A bare name is a built-in, `fn::`
    // a custom function, and `ml::` an ML model; which namespace a name falls in
    // decides what is invoked and what error an absent one raises. Clients MUST
    // pass the name through unaltered and MUST NOT attempt that split
    // themselves: doing so puts a copy of the server's resolution rules -- and
    // of the errors it raises for a model that needs an experimental capability
    // enabled -- into every SDK, where they drift.
    string name = 2;
    // The model version, for an ML model. Empty for functions, and for a model
    // whose version the server should choose.
    string version = 3;
    // The positional arguments.
    //
    // Passed as values, so they arrive exactly as any other parameter binding
    // does. This is the difference from synthesising `RETURN fn::foo(...)`
    // client-side, where each argument is lowered to SurrealQL text and back,
    // and a value whose text form does not round-trip identically to its bound
    // form behaves differently depending on which engine ran it.
    repeated surrealdb.protocol.v1.Value args = 4;
}

// Response carrying a call's result.
message RunResponse {
    surrealdb.protocol.v1.Value result = 1;
}

// Request to kill a live query.
message KillRequest {
    RequestContext context = 1;
    // The live query to kill, as returned by a LIVE SELECT.
    surrealdb.protocol.v1.Uuid live_query_id = 2;
}

// Response to a kill request.
message KillResponse {}

// ==================================================================== //
//                            Live queries                              //
// ==================================================================== //

// A position in a live query's notification history.
//
// Doubles as the dedupe key and the resume point. Under at-least-once
// delivery, a consumer that has already processed a cursor MUST ignore a
// repeat of it.
message LiveQueryCursor {
    // The commit versionstamp the notification was produced at. Notifications
    // for one subscription arrive in non-decreasing versionstamp order.
    uint64 versionstamp = 1;
    // Distinguishes notifications produced by the same commit, counting from
    // zero.
    uint32 sequence = 2;
}

// A live query to register and subscribe to in one step.
message LiveQueryRegistration {
    // A single LIVE SELECT statement.
    string query = 1;
    // Values bound as `$name`.
    surrealdb.protocol.v1.Variables variables = 2;
}

// Request to stream a live query's notifications.
//
// Registering and subscribing in one call closes a race that the two-step
// alternative cannot: notifications produced between `LIVE SELECT` returning
// and the subscription attaching have nowhere to go and are lost.
message SubscribeRequest {
    RequestContext context = 1;

    oneof subscribe_to {
        // Attach to a live query that already exists -- including one
        // registered by an ordinary `Query`. Does not affect its lifetime:
        // ending this stream leaves the live query running for its other
        // subscribers.
        surrealdb.protocol.v1.Uuid live_query_id = 2;
        // Register a new live query and subscribe to it atomically. Its
        // lifetime is bound to this stream: ending the stream kills it. You
        // kill what you created.
        LiveQueryRegistration query = 3;
    }

    // Resume from just after this position instead of starting at now.
    //
    // Only honoured when the server advertises `resumable`. A cursor the
    // server no longer retains ends the stream with CURSOR_TOO_OLD rather than
    // silently skipping the gap.
    LiveQueryCursor resume_from = 4;
}

// What happened to a record.
enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CREATED = 1;
    ACTION_UPDATED = 2;
    ACTION_DELETED = 3;
    // 4 was ACTION_KILLED. Termination is now the `end` frame, which can say
    // why; a killed notification carried no record and no value, so it was an
    // action only in name, and having two ways to end a stream invited clients
    // to handle one and not the other.
    reserved 4;
}

// A change to a record matched by a live query.
message Notification {
    // The live query that matched. Present because several subscriptions may
    // share a stream-independent id, and clients log against it.
    surrealdb.protocol.v1.Uuid live_query_id = 1;
    Action action = 2;
    // The record that changed.
    surrealdb.protocol.v1.RecordId record_id = 3;
    // The record's new content, or the diff, depending on how the live query
    // was declared. Absent for a delete.
    surrealdb.protocol.v1.Value value = 4;
    // This notification's position. The dedupe key under at-least-once
    // delivery, and what to store to resume later.
    LiveQueryCursor cursor = 5;
}

// The opening frame of a subscription stream.
message SubscribeBegin {
    // Identifies this subscription. Distinct from `live_query_id`, because one
    // live query may have many concurrent subscribers.
    surrealdb.protocol.v1.Uuid subscription_id = 1;
    // The live query being observed, whether it already existed or was created
    // by this call.
    surrealdb.protocol.v1.Uuid live_query_id = 2;
    // The position delivery starts after. Echoes `resume_from` when the
    // request carried one; otherwise the server's current position.
    LiveQueryCursor cursor = 3;
}

// Why a subscription stream ended.
enum SubscribeEndReason {
    SUBSCRIBE_END_REASON_UNSPECIFIED = 0;
    // The live query was killed, by a `KILL` statement through `Query` or by
    // the server. It is gone; do not re-subscribe. Every other subscription to
    // the same live query ends with this reason too.
    SUBSCRIBE_END_REASON_KILLED = 1;
    // The owning session was detached or reset.
    SUBSCRIBE_END_REASON_SESSION_CLOSED = 2;
    // The server is shutting down. Re-subscribing later is reasonable.
    SUBSCRIBE_END_REASON_SERVER_SHUTDOWN = 3;
    // The live query moved to another node. Re-subscribe; the id is still
    // valid.
    SUBSCRIBE_END_REASON_NODE_REASSIGNED = 4;
    // `resume_from` names a position the server no longer retains. The client
    // must re-register and accept that it has missed notifications.
    SUBSCRIBE_END_REASON_CURSOR_TOO_OLD = 5;
}

// The frame that ends a subscription stream.
message SubscribeEnd {
    SubscribeEndReason reason = 1;
    // The last position delivered, so a client can resume from here later.
    LiveQueryCursor cursor = 2;
}

// Streaming response carrying one live query's notifications.
//
// A subscription arrives as: `begin` once, then `notification` frames, then
// `end`. An `error` frame terminates the stream instead.
//
// Delivery depends on the server's live-query engine and is reported by
// `GetCapabilities`. Under AT_LEAST_ONCE -- the durable engine -- THE SAME
// NOTIFICATION MAY BE DELIVERED MORE THAN ONCE, and consumers MUST dedupe on
// `Notification.cursor`. Under AT_MOST_ONCE a notification may instead be lost
// and is never redelivered. Notifications are emitted only after the write
// transaction that produced them commits.
message SubscribeResponse {
    oneof frame {
        SubscribeBegin begin = 1;
        Notification notification = 2;
        SubscribeEnd end = 3;
        surrealdb.protocol.v1.SurrealError error = 4;
    }
}

// ==================================================================== //
//                          Import and export                           //
// ==================================================================== //

// The opening frame of an import stream, carrying the request's context.
message ImportSurqlBegin {
    RequestContext context = 1;
}

// A frame of a SurrealQL import stream.
//
// Framed as `begin` -> `chunk`* -> `trailer`. Bytes rather than parsed
// statements: a single INSERT can be hundreds of megabytes, so statement
// framing puts no bound on message size and forces the sender to parse before
// it can stream.
message ImportSurqlRequest {
    oneof frame {
        ImportSurqlBegin begin = 1;
        DataChunk chunk = 2;
        DataTrailer trailer = 3;
    }
}

// Response to an import request.
message ImportSurqlResponse {}

// Which parts of the database to export.
message ExportConfig {
    // An explicit list of tables to export.
    message SelectedTables {
        repeated string tables = 1;
    }

    // An explicit list of tables to withhold; every other table is exported.
    message ExcludedTables {
        repeated string tables = 1;
    }

    // Table selection for the export.
    //
    // FAIL CLOSED. A `Tables` that is PRESENT but whose `selection` is unset
    // MUST be rejected before any data is streamed. It MUST NOT be treated as
    // "no selection given", and therefore MUST NOT fall back to exporting
    // everything.
    //
    // That rule is the whole reason this note exists, and it is a safety
    // property rather than pedantry. `excluded` is newer than `all`, `none` and
    // `selected`, so a client that asks a server predating it to withhold two
    // tables sends an arm the server cannot decode; it lands in unknown fields
    // and `selection` reads as unset. A server that then defaults to "export
    // everything" has inverted the request precisely -- the caller named the
    // tables it did NOT want exported, and every one of them is in the output.
    // Refusing an unset `selection` turns that data leak into a loud failure,
    // and it is the only handling that stays correct when a further arm is added
    // later.
    //
    // Note this is distinct from `ExportConfig.tables` being ABSENT, which
    // remains "the client did not express a preference" and selects the server
    // default. Presence is what carries the distinction, which is why `Tables`
    // is a message and not an inlined oneof.
    //
    // Clients SHOULD avoid provoking that failure rather than relying on it:
    // send `excluded` only against a server advertising the
    // EXPORT_EXCLUDE_TABLES capability (see `ServerCapabilities.capabilities`).
    // The capability is the handshake; the MUST above is what holds when a
    // client skips it, or when a proxy synthesised the answer.
    message Tables {
        oneof selection {
            // Export all tables.
            surrealdb.protocol.v1.NullValue all = 1;
            // Export no tables.
            surrealdb.protocol.v1.NullValue none = 2;
            // Export only the named tables.
            SelectedTables selected = 3;
            // Export every table except the named ones.
            //
            // Requires the EXPORT_EXCLUDE_TABLES capability. Unlike the arms
            // above, a server that does not understand this one must fail the
            // export -- see the note on this message.
            ExcludedTables excluded = 4;
        }
    }

    // Include user definitions.
    bool users = 1;
    // Include access definitions.
    bool accesses = 2;
    // Include parameter definitions.
    bool params = 3;
    // Include function definitions.
    bool functions = 4;
    // Include analyzer definitions.
    bool analyzers = 5;
    // Which tables to include.
    Tables tables = 6;
    // Include record versions.
    bool versions = 7;
    // Include table records.
    bool records = 8;
    // Include sequence definitions.
    bool sequences = 9;
    // Include API definitions.
    bool apis = 10;
    // Include bucket definitions.
    bool buckets = 11;
    // Include module definitions.
    bool modules = 12;
    // Include config definitions.
    bool configs = 13;
}

// Request to export the database as SurrealQL.
message ExportSurqlRequest {
    RequestContext context = 1;
    ExportConfig config = 2;
}

// A frame of a SurrealQL export stream.
//
// Framed as `chunk`* -> `trailer`, or terminated by `error`. A stream that
// ends without a trailer MUST be treated as failed.
message ExportSurqlResponse {
    oneof frame {
        DataChunk chunk = 1;
        DataTrailer trailer = 2;
        surrealdb.protocol.v1.SurrealError error = 3;
    }
}

// Request to export a SurrealML model.
message ExportMlModelRequest {
    RequestContext context = 1;
    string name = 2;
    string version = 3;
}

// A frame of an ML-model export stream.
message ExportMlModelResponse {
    oneof frame {
        DataChunk chunk = 1;
        DataTrailer trailer = 2;
        surrealdb.protocol.v1.SurrealError error = 3;
    }
}

// The opening frame of an ML-model import stream.
//
// Carries the request's context, as `ImportSurqlBegin` does, for the same
// reason: the RPC is client-streaming, so there is no unary request message to
// put a `RequestContext` in field 1 of. Note that both this and
// `ImportSurqlBegin` are length-delimited at tag 1 of their envelope, so a
// generic reader that walks field 1 expecting a `RequestContext` decodes one into
// a plausible garbage session id rather than failing -- see the note on
// `RequestContext`.
message ImportMlModelBegin {
    RequestContext context = 1;
    // The model's name. Required.
    string name = 2;
    // The model's version. Required: a model is identified by name AND version,
    // and `ExportMlModel` takes both, so an import that omitted the version
    // could not name the artefact it just produced.
    string version = 3;
}

// A frame of an ML-model import stream.
//
// Framed as `begin` -> `chunk`* -> `trailer`, identical to `ImportSurqlRequest`,
// so one framing implementation serves both imports. The trailer's byte count
// and BLAKE3 are what mark the upload complete: a stream that ends without it
// MUST be treated as failed and the partial model discarded rather than
// registered.
message ImportMlModelRequest {
    oneof frame {
        ImportMlModelBegin begin = 1;
        DataChunk chunk = 2;
        DataTrailer trailer = 3;
    }
}

// Response to an ML-model import.
message ImportMlModelResponse {}

// Compression applied to exported data files.
enum ExportCompression {
    // No explicit compression was specified. On a request this selects the
    // server default; it MUST NOT appear on a response frame.
    EXPORT_COMPRESSION_UNSPECIFIED = 0;
    // Files are streamed uncompressed.
    EXPORT_COMPRESSION_NONE = 1;
    // Each file's bytes are zstd-compressed (the on-disk `.surql.zst` form).
    EXPORT_COMPRESSION_ZSTD = 2;
}

// Stream the export to the requesting client, which writes the files to its
// own local disk.
message ClientStreamDestination {}

// Write the export directly to an object-storage bucket from the server.
//
// Reserved for a future server-side destination; not yet served.
message BucketDestination {
    // The bucket URL (for example `s3://my-bucket`).
    string url = 1;
    // A key prefix within the bucket to write files under.
    string prefix = 2;
}

// Where the exported files should be written.
message ExportDestination {
    oneof destination {
        // Stream the files back to the client (the default).
        ClientStreamDestination client_stream = 1;
        // Write the files to an object-storage bucket (future).
        BucketDestination bucket = 2;
    }
}

// Request to export data from the database as a streamed directory.
message ExportDirectoryRequest {
    RequestContext context = 1;
    // Which sections of the database to export.
    ExportConfig config = 2;
    // The compression to apply to each data file.
    ExportCompression compression = 3;
    // A hint for how many files to produce concurrently. Zero means the
    // server chooses a default.
    uint32 parallelism = 4;
    // The directory format version the client expects. Empty means the client
    // accepts whatever the server produces. A server that cannot produce the
    // requested version rejects the request before sending any frame.
    string format_version = 5;
    // Where the server should write the exported files. Unset is equivalent
    // to a client_stream destination. A server that does not support the
    // requested destination rejects the request before sending any frame.
    ExportDestination destination = 6;
}

// Frame: the export has begun. Sent once, before any files.
message ExportDirectoryBegin {
    // The directory format version.
    string format_version = 1;
    // The namespace being exported.
    string namespace = 2;
    // The database being exported.
    string database = 3;
    // The SurrealDB version producing the export.
    string surrealdb_version = 4;
    // The compression applied to the data files.
    ExportCompression compression = 5;
}

// Frame: a new file in the stream has begun.
//
// All frames for a given file share its `file_id`. A file's own frames are
// always ordered FileBegin -> FileChunk* -> FileEnd, but frames belonging to
// different files MAY be interleaved when the server streams files
// concurrently.
message FileBegin {
    // Correlates this file's frames within the stream. Values are unique for
    // the lifetime of the stream and are never reused, even after the file's
    // FileEnd; a FileBegin repeating a previously seen file_id is a protocol
    // error.
    uint64 file_id = 1;
    // The file's path relative to the export root. Paths use `/` separators
    // and MUST NOT be absolute, contain `..` components, or repeat within the
    // stream; clients MUST reject a violating path before opening any file.
    string relative_path = 2;
    // The table the file holds data for. Empty for schema or metadata files
    // (table names are never empty).
    string table = 3;
    // The compression applied to this file's chunks.
    ExportCompression compression = 4;
}

// Frame: a chunk of a file's content.
//
// `data` carries the file's on-disk bytes verbatim — already zstd-compressed
// when the file's compression is ZSTD. Producers MUST NOT exceed 1 MiB
// (1,048,576 bytes) of data per chunk (256 KiB is the recommended default),
// so neither peer ever buffers a whole file; consumers MAY treat a larger
// chunk as a protocol error. Chunk boundaries carry no meaning: a file may be
// split at any byte position, and empty chunks are permitted.
message FileChunk {
    // The file this chunk belongs to.
    uint64 file_id = 1;
    // The chunk's bytes.
    bytes data = 2;
}

// Frame: a file has ended.
//
// The trailer carries the file's total size and hash, both computed
// incrementally while the chunks were produced — so no whole-file buffering is
// needed to learn them up front. Clients MUST verify that the bytes they
// received for the file match both `bytes` and `blake3`, and treat any
// mismatch as a failed export.
message FileEnd {
    // The file these totals apply to.
    uint64 file_id = 1;
    // The total number of bytes streamed for the file.
    uint64 bytes = 2;
    // The BLAKE3 of the streamed bytes, lowercase hex.
    string blake3 = 3;
}

// Frame: the export completed successfully.
//
// This is the completion token. A stream that ends without this frame MUST be
// treated as failed, and the client MUST NOT leave behind an importable
// directory.
//
// The manifest is not carried here: `manifest.json` is streamed as the final
// file of the export, listing every other file in replay order (the order an
// importer must apply them) in the schema defined by the directory format
// version, and its content MUST agree with the streamed FileBegin and FileEnd
// frames. This keeps the terminal frame O(1) regardless of how many files the
// export contains.
message ExportDirectoryEnd {
    // The total number of files streamed, including `manifest.json`.
    uint64 file_count = 1;
    // The sum of every streamed file's size (the sum of all `FileEnd.bytes`).
    uint64 total_bytes = 2;
}

// A single frame in a directory export stream.
//
// A successful export arrives as: Begin (exactly once, first), then for each
// file FileBegin -> FileChunk* -> FileEnd, then End. The final file streamed
// is always `manifest.json`, which lists every other file. An error frame MAY
// terminate the stream at any point instead, including before Begin and while
// files are still open; all open files are then abandoned and no further
// frames follow.
//
// A single file's frames are always sent in order, but frames belonging to
// different `file_id`s MAY be interleaved; clients MUST demultiplex by
// `file_id`.
//
// Clients MUST treat any deviation from this grammar as a failed export,
// including a response whose frame is unset (an unrecognised variant from a
// newer server). Servers MUST NOT send frame variants that the format version
// negotiated with the client does not define.
message ExportDirectoryResponse {
    oneof frame {
        // The export has begun.
        ExportDirectoryBegin begin = 1;
        // A new file has begun.
        FileBegin file_begin = 2;
        // A chunk of the current file.
        FileChunk file_chunk = 3;
        // The current file has ended (size + hash trailer).
        FileEnd file_end = 4;
        // The export completed successfully (carries the stream totals).
        ExportDirectoryEnd end = 5;
        // The export failed.
        surrealdb.protocol.v1.SurrealError error = 6;
    }
}
