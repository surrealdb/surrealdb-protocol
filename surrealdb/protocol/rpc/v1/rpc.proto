syntax = "proto3";

package surrealdb.protocol.rpc.v1;

import "surrealdb/protocol/v1/value.proto";

// SurrealDB service.
service SurrealDBService {
    // Check the health of the database.
    rpc Health(HealthRequest) returns (HealthResponse);
    // Get the version of the database.
    rpc Version(VersionRequest) returns (VersionResponse);

    // Sign up a new user.
    rpc Signup(SignupRequest) returns (SignupResponse);
    // Sign in a user.
    rpc Signin(SigninRequest) returns (SigninResponse);
    // Authenticate a user with a token.
    rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
    // Use a namespace and database.
    rpc Use(UseRequest) returns (UseResponse);
    // Set a global variable for the current session.
    rpc Set(SetRequest) returns (SetResponse);
    // Unset a global variable for the current session.
    rpc Unset(UnsetRequest) returns (UnsetResponse);
    // Clear the current IAM session info.
    rpc Invalidate(InvalidateRequest) returns (InvalidateResponse);
    // Clear the current IAM session info and reset all global variables for the current session (ns, db, vars).
    rpc Reset(ResetRequest) returns (ResetResponse);

    // Import data into the database.
    // All statements are executed in the same transaction.
    rpc ImportSql(stream ImportSqlRequest) returns (ImportSqlResponse);
    // Export data from the database.
    rpc ExportSql(ExportSqlRequest) returns (stream ExportSqlResponse);
    // Export data from the database as a stream of directory files.
    //
    // Unlike ExportSql, which emits a flat SurrealQL statement stream, this
    // reproduces a directory-format export (manifest + schema + per-table data
    // files) over the wire. Each file is framed as FileBegin -> FileChunk* ->
    // FileEnd, so neither peer ever buffers a whole file; the file's byte count
    // and SHA-256 are carried in the FileEnd trailer, computed incrementally as
    // chunks are produced. The manifest is streamed as the final file, and the
    // End frame is the completion token.
    rpc ExportDirectory(ExportDirectoryRequest) returns (stream ExportDirectoryResponse);

    // Export the ML model.
    rpc ExportMlModel(ExportMlModelRequest) returns (stream ExportMlModelResponse);

    // Query the database and get a stream of values.
    //
    // Cancelling the RPC aborts execution: without a txn_id, the implicit
    // transaction is rolled back (streamed results do not imply a commit;
    // only a completed stream does). With a txn_id, the transaction is
    // session-owned and remains open across a cancelled RPC.
    rpc Query(QueryRequest) returns (stream QueryResponse);
    // Issue a live query and get a stream of notifications.
    rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);
}

// Request to check the health of the database.
message HealthRequest {}

// Response to a health check request.
message HealthResponse {
}

// Request to get the version of the database.
message VersionRequest {}

// Response to a version request.
message VersionResponse {
    string version = 1;
}

// Request to sign up a new user.
message SignupRequest {
    string namespace = 1;
    string database = 2;
    string access_name = 3;
    surrealdb.protocol.v1.Variables variables = 4;
}

// Response to a signup request.
message SignupResponse {
    surrealdb.protocol.v1.Value value = 1;
}

// Request to sign in a user.
message SigninRequest {
    AccessMethod access_method = 1;
}

// Response to a signin request.
message SigninResponse {
    surrealdb.protocol.v1.Value value = 1;
}

// Request to authenticate a user.
message AuthenticateRequest {
    string token = 1;
}

// Response to an authenticate request.
message AuthenticateResponse {
    surrealdb.protocol.v1.Value value = 1;
}

// Request to use a namespace and database.
message UseRequest {
    // The namespace to use.
    // An empty namespace will unset the current namespace.
    string namespace = 1;
    // The database to use.
    // An empty database will unset the current database.
    string database = 2;
}

// Response to a use request.
message UseResponse {
    // The namespace that is now in use.
    string namespace = 1;
    // The database that is now in use.
    string database = 2;
}

// Request to set a global variable for the current session.
message SetRequest {
    // The name of the variable to set.
    string name = 1;
    // The value to set the variable to.
    surrealdb.protocol.v1.Value value = 2;
}

// Response to a set request.
message SetResponse {}

// Request to unset a global variable for the current session.
message UnsetRequest {
    // The name of the variable to unset.
    string name = 1;
}

// Response to an unset request.
message UnsetResponse {}

// Request to invalidate the current session.
message InvalidateRequest {}

// Response to an invalidate request.
message InvalidateResponse {}

// Request to reset all global variables for the current session.
message ResetRequest {}

// Response to a reset request.
message ResetResponse {}

// Request to import data into the database.
message ImportSqlRequest {
    string statement = 1;
}

// Response to an import request.
message ImportSqlResponse {}

// Request to export data from the database.
message ExportSqlRequest {
    message SelectedTables {
        repeated string tables = 1;
    }

    message Tables {
        oneof selection {
            surrealdb.protocol.v1.NullValue all = 1;
            surrealdb.protocol.v1.NullValue none = 2;
            SelectedTables selected = 3;
        }
    }

    bool users = 1;
    bool accesses = 2;
    bool params = 3;
    bool functions = 4;
    bool analyzers = 5;
    Tables tables = 6;
    bool versions = 7;
    bool records = 8;
    bool sequences = 9;
}

// Response to an export request.
message ExportSqlResponse {
    string statement = 1;
}

// Request to export the ML model.
message ExportMlModelRequest {
    string name = 1;
    string version = 2;
}

// Response to an export request.
message ExportMlModelResponse {
    bytes model = 1;
}

// Compression applied to exported data files.
enum ExportCompression {
    // No explicit compression was specified. On a request this selects the
    // server default; it MUST NOT appear on a response frame.
    EXPORT_COMPRESSION_UNSPECIFIED = 0;
    // Files are streamed uncompressed.
    EXPORT_COMPRESSION_NONE = 1;
    // Each file's bytes are zstd-compressed (the on-disk `.surql.zst` form).
    EXPORT_COMPRESSION_ZSTD = 2;
}

// Which sections of the database to include in a directory export.
//
// Mirrors the fields of `ExportSqlRequest`; kept as a distinct message so the
// directory export surface can evolve independently of the SurrealQL export.
message ExportConfig {
    // An explicit list of tables to export.
    message SelectedTables {
        repeated string tables = 1;
    }

    // Table selection for the export.
    message Tables {
        oneof selection {
            // Export all tables.
            surrealdb.protocol.v1.NullValue all = 1;
            // Export no tables.
            surrealdb.protocol.v1.NullValue none = 2;
            // Export only the named tables.
            SelectedTables selected = 3;
        }
    }

    // Include user definitions.
    bool users = 1;
    // Include access definitions.
    bool accesses = 2;
    // Include parameter definitions.
    bool params = 3;
    // Include function definitions.
    bool functions = 4;
    // Include analyzer definitions.
    bool analyzers = 5;
    // Which tables to include.
    Tables tables = 6;
    // Include record versions.
    bool versions = 7;
    // Include table records.
    bool records = 8;
    // Include sequence definitions.
    bool sequences = 9;
}

// Stream the export to the requesting client, which writes the files to its
// own local disk.
message ClientStreamDestination {}

// Write the export directly to an object-storage bucket from the server.
//
// Reserved for a future server-side destination; not yet served.
message BucketDestination {
    // The bucket URL (for example `s3://my-bucket`).
    string url = 1;
    // A key prefix within the bucket to write files under.
    string prefix = 2;
}

// Where the exported files should be written.
message ExportDestination {
    oneof destination {
        // Stream the files back to the client (the default).
        ClientStreamDestination client_stream = 1;
        // Write the files to an object-storage bucket (future).
        BucketDestination bucket = 2;
    }
}

// Request to export data from the database as a streamed directory.
message ExportDirectoryRequest {
    // Which sections of the database to export.
    ExportConfig config = 1;
    // The compression to apply to each data file.
    ExportCompression compression = 2;
    // A hint for how many files to produce concurrently. Zero means the
    // server chooses a default.
    uint32 parallelism = 3;
    // The directory format version the client expects. Empty means the client
    // accepts whatever the server produces. A server that cannot produce the
    // requested version rejects the request before sending any frame.
    string format_version = 4;
    // Where the server should write the exported files. Unset is equivalent
    // to a client_stream destination. A server that does not support the
    // requested destination rejects the request before sending any frame.
    ExportDestination destination = 5;
}

// Frame: the export has begun. Sent once, before any files.
message ExportDirectoryBegin {
    // The directory format version.
    string format_version = 1;
    // The namespace being exported.
    string namespace = 2;
    // The database being exported.
    string database = 3;
    // The SurrealDB version producing the export.
    string surrealdb_version = 4;
    // The compression applied to the data files.
    ExportCompression compression = 5;
}

// Frame: a new file in the stream has begun.
//
// All frames for a given file share its `file_id`. A file's own frames are
// always ordered FileBegin -> FileChunk* -> FileEnd, but frames belonging to
// different files MAY be interleaved when the server streams files
// concurrently.
message FileBegin {
    // Correlates this file's frames within the stream. Values are unique for
    // the lifetime of the stream and are never reused, even after the file's
    // FileEnd; a FileBegin repeating a previously seen file_id is a protocol
    // error.
    uint64 file_id = 1;
    // The file's path relative to the export root. Paths use `/` separators
    // and MUST NOT be absolute, contain `..` components, or repeat within the
    // stream; clients MUST reject a violating path before opening any file.
    string relative_path = 2;
    // The table the file holds data for. Empty for schema or metadata files
    // (table names are never empty).
    string table = 3;
    // The compression applied to this file's chunks.
    ExportCompression compression = 4;
}

// Frame: a chunk of a file's content.
//
// `data` carries the file's on-disk bytes verbatim — already zstd-compressed
// when the file's compression is ZSTD. Producers MUST NOT exceed 1 MiB
// (1,048,576 bytes) of data per chunk (256 KiB is the recommended default),
// so neither peer ever buffers a whole file; consumers MAY treat a larger
// chunk as a protocol error. Chunk boundaries carry no meaning: a file may be
// split at any byte position, and empty chunks are permitted.
message FileChunk {
    // The file this chunk belongs to.
    uint64 file_id = 1;
    // The chunk's bytes.
    bytes data = 2;
}

// Frame: a file has ended.
//
// The trailer carries the file's total size and hash, both computed
// incrementally while the chunks were produced — so no whole-file buffering is
// needed to learn them up front. Clients MUST verify that the bytes they
// received for the file match both `bytes` and `sha256`, and treat any
// mismatch as a failed export.
message FileEnd {
    // The file these totals apply to.
    uint64 file_id = 1;
    // The total number of bytes streamed for the file.
    uint64 bytes = 2;
    // The SHA-256 of the streamed bytes, lowercase hex.
    string sha256 = 3;
}

// Frame: the export completed successfully.
//
// This is the completion token. A stream that ends without this frame MUST be
// treated as failed, and the client MUST NOT leave behind an importable
// directory.
//
// The manifest is not carried here: `manifest.json` is streamed as the final
// file of the export, listing every other file in replay order (the order an
// importer must apply them) in the schema defined by the directory format
// version, and its content MUST agree with the streamed FileBegin and FileEnd
// frames. This keeps the terminal frame O(1) regardless of how many files the
// export contains.
message ExportDirectoryEnd {
    // The total number of files streamed, including `manifest.json`.
    uint64 file_count = 1;
    // The sum of every streamed file's size (the sum of all `FileEnd.bytes`).
    uint64 total_bytes = 2;
}

// Frame: the export failed. Terminates the stream.
//
// An Error frame MAY arrive at any point, including before Begin and while
// files are still open. All open files are abandoned and no further frames
// follow.
message ExportError {
    // The error code.
    int64 code = 1;
    // The error message.
    string message = 2;
}

// A single frame in a directory export stream.
//
// Modelled on the QueryResponse streaming envelope. A successful export
// arrives as: Begin (exactly once, first), then for each file
// FileBegin -> FileChunk* -> FileEnd, then End. The final file streamed is
// always `manifest.json`, which lists every other file. An Error frame MAY
// terminate the stream at any point instead.
//
// A single file's frames are always sent in order, but frames belonging to
// different `file_id`s MAY be interleaved; clients MUST demultiplex by
// `file_id`.
//
// Clients MUST treat any deviation from this grammar as a failed export,
// including a response whose frame is unset (an unrecognised variant from a
// newer server). Servers MUST NOT send frame variants that the format version
// negotiated with the client does not define.
message ExportDirectoryResponse {
    oneof frame {
        // The export has begun.
        ExportDirectoryBegin begin = 1;
        // A new file has begun.
        FileBegin file_begin = 2;
        // A chunk of the current file.
        FileChunk file_chunk = 3;
        // The current file has ended (size + hash trailer).
        FileEnd file_end = 4;
        // The export completed successfully (carries the stream totals).
        ExportDirectoryEnd end = 5;
        // The export failed.
        ExportError error = 6;
    }
}

// Request to issue a live query.
message SubscribeRequest {
    oneof subscribe_to {
        surrealdb.protocol.v1.Uuid live_query_id = 1;
        QueryRequest query = 2;
    }
}

// Action type.
enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_CREATED = 1;
    ACTION_UPDATED = 2;
    ACTION_DELETED = 3;
    ACTION_KILLED = 4;
}

// Response to a live query.
message SubscribeResponse {
    Notification notification = 1;
}

// A notification from a live query.
message Notification {
    surrealdb.protocol.v1.Uuid live_query_id = 1;
    Action action = 2;
    surrealdb.protocol.v1.RecordId record_id = 3;
    surrealdb.protocol.v1.Value value = 4;
}

// Request to query the database.
message QueryRequest {
    string query = 1;
    surrealdb.protocol.v1.Variables variables = 2;
    surrealdb.protocol.v1.Uuid txn_id = 3;

    // Field 4 is earmarked for a future capability list (e.g. accepted result
    // encodings such as columnar Arrow batches). Servers MUST NOT emit result
    // payloads or response kinds a client has not explicitly opted in to.
}

// The kind of query response.
//
// New kinds will only ever be sent to clients that explicitly opt in via a
// QueryRequest capability; clients MAY treat an unrecognised kind as a
// protocol error.
enum QueryResponseKind {
    QUERY_RESPONSE_KIND_UNSPECIFIED = 0;
    // A single value is contained in the response and no further responses are expected.
    //
    // This is used in the context of `SELECT ONLY ...` or other queries that should only ever return a single value.
    //
    // This is the final response for its query index and carries the query stats.
    QUERY_RESPONSE_KIND_SINGLE = 1;
    // A batch of values is contained in the response and further responses may be expected.
    QUERY_RESPONSE_KIND_BATCHED = 2;
    // The final response from a batched query. No further responses for this query ID are expected.
    //
    // This response should always contain the query stats.
    //
    // Note: If all response values can fit in a single batch, this will be the first and only response.
    QUERY_RESPONSE_KIND_BATCHED_FINAL = 3;
}

// Streaming response to a query request.
//
// When a query has 5 statements, there will be 5 unique query indexes (0..4).
//
// Ordering: responses that share a query_index are always sent in ascending
// batch_index order. Responses for DIFFERENT query indexes MAY be interleaved
// arbitrarily; clients MUST demultiplex by query_index and MUST NOT assume
// one statement's responses finish before another's begin. This is what
// allows a server to stream each statement's batches as soon as they are
// produced. For example:
//  QueryResponse(query_index=0, batch_index=0)
//  QueryResponse(query_index=1, batch_index=0, stats=Some(..))  // q1 complete
//  QueryResponse(query_index=0, batch_index=1, stats=Some(..))  // q0 complete
//  QueryResponse(query_index=2, batch_index=0)
//  QueryResponse(query_index=2, batch_index=1, stats=Some(..))  // q2 complete
//
// Lifecycle: every query index in 0..result_count emits at least one
// response. The final response for a query index is the one carrying stats
// and/or error; treat their presence as the authoritative end-of-results
// signal for that index.
//
// Errors: a response with error set is the final response for its
// query index; its values are empty, stats MAY be present, and responses for
// other query indexes continue to arrive. result_count includes errored
// statements. Failures that occur before execution begins (parse errors,
// authentication, an unknown txn_id) terminate the RPC with a gRPC status
// error and no QueryResponse frames.
message QueryResponse {
    // The index of the query result.
    uint32 query_index = 1;
    // The index of the batch within the given query.
    uint64 batch_index = 2;
    // The total number of query results.
    //
    // Every response will contain the same value for this field so you can
    // use the value from the first response to determine how many query results
    // to expect.
    //
    // Note: This is NOT the number of records returned.
    //
    // Examples:
    //   query = "SELECT * FROM users;"
    //   result_count = 1
    //
    //   query = """
    //   SELECT * FROM users;
    //   SELECT * FROM posts;
    //   """
    //   result_count = 2
    //
    //   query = """
    //   SELECT * FROM users;
    //   SELECT * FROM posts;
    //   SELECT * FROM comments;
    //   """
    //   result_count = 3
    uint32 result_count = 3;
    // The kind of query response.
    QueryResponseKind kind = 4;
    // The query stats.
    // Present only on the final response of each query index.
    QueryStats stats = 5;
    // The error, if any. A response carrying an error is the final response
    // for its query index.
    QueryError error = 6;
    // A batch of values. This is the only result payload in this version of
    // the protocol. Future result encodings (for example a columnar Arrow
    // batch) will be added as sibling submessage fields (field 8 onwards) and
    // MUST only be emitted when the client explicitly opts in via
    // QueryRequest; exactly one payload field is populated per response.
    repeated surrealdb.protocol.v1.Value values = 7;
}

// Query statistics.
message QueryStats {
    // The number of records returned. -1 if unknown.
    int64 records_returned = 1;
    // The number of bytes returned. -1 if unknown.
    int64 bytes_returned = 2;
    // The number of records scanned. -1 if unknown.
    int64 records_scanned = 3;
    // The number of bytes scanned. -1 if unknown.
    int64 bytes_scanned = 4;
    // The duration of the query.
    surrealdb.protocol.v1.Duration execution_duration = 5;
}

// Query error.
message QueryError {
    // The error code.
    int64 code = 1;
    // The error message.
    string message = 2;
}

// Root user credentials.
message RootUserCredentials {
    string username = 1;
    string password = 2;
}

// Namespace access credentials.
message NamespaceAccessCredentials {
    string namespace = 1;
    string access = 2;
    string key = 3;
}

// Database access credentials.
message DatabaseAccessCredentials {
    string namespace = 1;
    string database = 2;
    string access = 3;
    string key = 4;
    string refresh = 5;
}

// Namespace user credentials.
message NamespaceUserCredentials {
    string namespace = 1;
    string username = 2;
    string password = 3;
}

// Database user credentials.
message DatabaseUserCredentials {
    string namespace = 1;
    string database = 2;
    string username = 3;
    string password = 4;
}

// Access token.
message AccessToken {
    string token = 1;
}

// Method of authenticating with the database.
message AccessMethod {
    oneof method {
        RootUserCredentials root = 1;
        NamespaceAccessCredentials namespace = 2;
        DatabaseAccessCredentials database = 3;
        NamespaceUserCredentials namespace_user = 4;
        DatabaseUserCredentials database_user = 5;
        AccessToken access_token = 6;
    }
}

