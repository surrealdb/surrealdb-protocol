
syntax = "proto3";

package surrealdb.protocol.v1;

// SurrealDB `NULL` — the value here is explicitly null.
//
// Distinct from `NoneValue`. See the note on `Value`.
message NullValue {}

// SurrealDB `NONE` — there is no value here.
//
// Distinct from `NullValue`, and distinct from an absent object key. Encoders
// MUST emit this variant for `NONE`; an unset `Value.value` oneof is NOT
// `NONE`. See the note on `Value`.
message NoneValue {}

// A duration.
//
// Replaces `google.protobuf.Duration`, whose specification caps `seconds` at
// +/-315,576,000,000 — roughly +/-10,000 years. SurrealDB durations are
// `std::time::Duration`: unsigned, up to `u64::MAX` seconds. The well-known
// type silently truncated anything larger. Byte-identical to `Duration` in
// value.fbs.
message Duration {
    // Whole seconds. Always non-negative; SurrealDB durations are unsigned.
    uint64 seconds = 1;
    // Sub-second remainder. MUST be in [0, 999999999]; decoders MUST reject
    // larger values rather than normalising them.
    uint32 nanos = 2;
}

// A UTC instant.
//
// Replaces `google.protobuf.Timestamp`, whose specification caps the range at
// 0001-01-01 .. 9999-12-31. SurrealDB datetimes are `chrono::DateTime<Utc>`
// and span roughly +/-262,000 years. Byte-identical to `Timestamp` in
// value.fbs.
message Datetime {
    // Seconds since the Unix epoch. May be negative.
    int64 seconds = 1;
    // Sub-second remainder, always ADDED to `seconds` — never subtracted, even
    // when `seconds` is negative. MUST be in [0, 999999999].
    uint32 nanos = 2;
}

// Decimal value.
message Decimal {
    string value = 1;
}

// UUID value.
message Uuid {
    // The UUID as 16 raw bytes, big-endian (RFC 9562 network byte order).
    //
    // Raw bytes rather than the 36-character hyphenated form: UUIDs ride on
    // every live-query notification and inside record ids, where the string
    // form costs roughly double and a parse per use. Decoders MUST reject a
    // value whose length is not exactly 16.
    bytes bytes = 1;
}

// Point type.
message Point {
    double x = 1;
    double y = 2;
}

// Line type.
message Line {
    repeated Point points = 1;
}

// Polygon type.
message Polygon {
    // Exterior ring.
    Line exterior = 1;
    // Interior rings.
    repeated Line interiors = 2;
}

// MultiPoint type.
message MultiPoint {
    repeated Point points = 1;
}

// MultiLine type.
message MultiLine {
    repeated Line lines = 1;
}

// MultiPolygon type.
message MultiPolygon {
    repeated Polygon polygons = 1;
}

// GeometryCollection type.
message GeometryCollection {
    repeated Geometry geometries = 1;
}

// Generic geometry type.
message Geometry {
    oneof geometry {
        Point point = 1;
        Line line = 2;
        Polygon polygon = 3;
        MultiPoint multi_point = 4;
        MultiLine multi_line = 5;
        MultiPolygon multi_polygon = 6;
        GeometryCollection collection = 7;
    }
}

// Record ID type.
message RecordId {
    // Table name.
    string table = 1;
    // Record ID.
    RecordIdKey id = 2;
}

// File type.
message File {
    // Bucket name.
    string bucket = 1;
    // File key.
    string key = 2;
}

// Array type.
message Array {
    repeated Value values = 1;
}

// Set type.
message Set {
    repeated Value values = 1;
}

// A key and its value.
//
// `value` MUST be set. An unset `value` is a protocol error, not an implicit
// `NONE`: there is exactly one way to express `NONE` (`Value.none`), and a
// missing submessage is indistinguishable from a truncated or buggy encoder.
message KeyValue {
    string key = 1;
    Value value = 2;
}

// A SurrealDB object.
//
// Mirrors `BTreeMap<String, Value>`: keys MUST be unique and MUST appear in
// ascending UTF-8 byte order. Decoders MUST reject duplicate keys rather than
// applying last-wins.
//
// This is `repeated`, not `map`, for three reasons:
//  1. proto3 implementations disagree on how to carry a map entry whose
//     message value equals its default. prost omits the value field entirely
//     (`encode_with_default` skips when `val == val_default`, and
//     `Value::default()` is `NONE`); ts-proto then drops the whole entry
//     because its decoder guards on `entry.value !== undefined`. The result
//     was that `{"k": NONE}` encoded in Rust decoded in TypeScript as `{}`,
//     silently destroying the NONE/absent distinction on one direction only.
//  2. proto3 map field ordering is unspecified, so a map cannot be canonically
//     encoded or hashed.
//  3. It matches `Object` in value.fbs exactly.
//
// The encoding is wire-compatible with the map it replaces — proto3 maps are
// themselves repeated two-field messages — so only the generated accessors and
// the semantics change.
message Object {
    repeated KeyValue items = 1;
}


// Value bound type.
message ValueBound {
    oneof bound {
        Value inclusive = 1;
        Value exclusive = 2;
        NullValue unbounded = 3;
    }
}

// Range type.
message Range {
    ValueBound start = 1;
    ValueBound end = 2;
}

// A SurrealDB value.
//
// EXACTLY ONE arm is populated on a well-formed message. An unset `value`
// oneof does NOT mean `NONE` — it means the peer sent a variant this build
// does not know about (a newer server), or the message is malformed. Decoders
// MUST treat an unset oneof as an error, never as `NONE`. Reinterpreting it
// would let a client silently downgrade an unknown value to `NONE` and write
// that back to the database.
//
// `NONE`, `NULL`, and an absent object key are three distinct states and all
// three round-trip:
//   NONE        -> `none`, an explicit variant
//   NULL        -> `null`
//   absent key  -> no `KeyValue` entry for that key at all
message Value {
    oneof value {
        NoneValue none = 1;
        NullValue null = 2;
        bool bool = 3;
        int64 int64 = 4;
        double float64 = 5;
        Decimal decimal = 6;
        string string = 7;
        bytes bytes = 8;
        Duration duration = 9;
        Datetime datetime = 10;
        Uuid uuid = 11;
        Geometry geometry = 12;
        string table = 13;
        RecordId record_id = 14;
        string string_record_id = 15;
        File file = 16;
        Range range = 17;
        string regex = 18;
        Object object = 19;
        Array array = 20;
        Set set = 21;
    }
}

message RecordIdKeyBound {
    oneof bound {
        RecordIdKey inclusive = 1;
        RecordIdKey exclusive = 2;
        NullValue unbounded = 3;
    }
}

// ID range type.
message RecordIdKeyRange {
    RecordIdKeyBound start = 1;
    RecordIdKeyBound end = 2;
}

// A record id's key part — the `id` in `table:id`.
//
// As with `Value`, an unset `id` oneof means an unknown variant or a malformed
// message, and MUST be rejected rather than defaulted.
message RecordIdKey {
    oneof id {
        int64 int64 = 1;
        string string = 2;
        Uuid uuid = 3;
        Array array = 4;
        RecordIdKeyRange range = 5;
        Object object = 6;
        // Tags 7 and 8 match `RecordIdKeyType` in value.fbs, which gained
        // these variants first.
        double float64 = 7;
        Decimal decimal = 8;
    }
}

// Query variables, bound as `$name`.
//
// Same rules as `Object`: unique keys, ascending UTF-8 byte order, duplicates
// rejected, and `repeated` rather than `map` for the reasons documented there.
message Variables {
    repeated KeyValue variables = 1;
}

// Kind system messages
message AnyKind {}
message NullKind {}
message BoolKind {}
message BytesKind {}
message DatetimeKind {}
message DecimalKind {}
message DurationKind {}
message FloatKind {}
message IntKind {}
message NumberKind {}
message ObjectKind {}
message PointKind {}
message StringKind {}
message UuidKind {}
message RegexKind {}
message RangeKind {}

message TableName { 
    string name = 1; 
}

message RecordKind {
    repeated TableName tables = 1;
}

message GeometryKind {
    repeated string types = 1;
}

message FileKind {
    repeated string buckets = 1;
}

message OptionKind {
    Kind inner = 1;
}

message EitherKind {
    repeated Kind kinds = 1;
}

message SetKind {
    Kind inner = 1;
    uint64 size = 2;
}

message ArrayKind {
    Kind inner = 1;
    uint64 size = 2;
}

message FunctionKind {
    repeated Kind args = 1;
    Kind return_type = 2;
}

// Literal types
message LiteralArray {
    repeated Kind kinds = 1;
}

message ObjectField {
    string key = 1;
    Kind kind = 2;
}

message LiteralObject {
    repeated ObjectField fields = 1;
}

message LiteralDiscriminatedObject {
    string discriminant_key = 1;
    repeated LiteralObject variants = 2;
}

message LiteralKind {
    oneof literal {
        string string_value = 1;
        int64 int64_value = 2;
        uint64 uint64_value = 3;
        double float64_value = 4;
        Decimal decimal_value = 5;
        Duration duration_value = 6;
        bool bool_value = 7;
        LiteralArray array_value = 8;
        LiteralObject object_value = 9;
        LiteralDiscriminatedObject discriminated_object_value = 10;
    }
}

// Main Kind message
message Kind {
    oneof kind {
        AnyKind any = 1;
        NullKind null = 2;
        BoolKind bool = 3;
        BytesKind bytes = 4;
        DatetimeKind datetime = 5;
        DecimalKind decimal = 6;
        DurationKind duration = 7;
        FloatKind float = 8;
        IntKind int = 9;
        NumberKind number = 10;
        ObjectKind object = 11;
        PointKind point = 12;
        StringKind string = 13;
        UuidKind uuid = 14;
        RegexKind regex = 15;
        RecordKind record = 16;
        GeometryKind geometry = 17;
        OptionKind option = 18;
        EitherKind either = 19;
        SetKind set = 20;
        ArrayKind array = 21;
        FunctionKind function = 22;
        RangeKind range = 23;
        LiteralKind literal = 24;
        FileKind file = 25;
    }
}
